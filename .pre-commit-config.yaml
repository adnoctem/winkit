# ref: https://github.com/pre-commit/pre-commit/issues/1930
# default_language_version:
#   ruby: 3.2.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Trailing whitespace is significant in LGPO text policy values.
        exclude: ^resources/policies/.*\.txt$
      - id: mixed-line-ending
        args: [--fix=crlf]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^CHANGELOG\.md$
        args:
          - "-c"
          - ".github/linters/.markdown-lint.yml"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      # Run the linter.
      - id: zizmor
        args:
          - "-c"
          - ".github/linters/zizmor.yaml"

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos
        exclude: (.*\.yaml|^CHANGELOG.md$)
        args:
          - "--config"
          - ".github/linters/.typos.toml"

  # Local hooks
  - repo: local
    hooks:
      - id: prettier-format
        name: Prettier format
        entry: bun x prettier --write "**/*.md" --prose-wrap=always --end-of-line=crlf --print-width=140
        language: system
        pass_filenames: false

      - id: powershell-format-check
        name: PowerShell format check
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/format.ps1 -Check
        language: system
        pass_filenames: false

      - id: powershell-format
        name: PowerShell format
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/format.ps1
        language: system
        pass_filenames: false

      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/lint.ps1
        language: system
        pass_filenames: false
