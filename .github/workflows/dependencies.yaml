name: "PSGallery Dependencies"

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: read-all

defaults:
  run:
    shell: pwsh

jobs:
  dependencies:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ANC_GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open dependency update pull request
        run: .\winkit.ps1 deps
