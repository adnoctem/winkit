name: "Run Super-Linter"

on: ["push", "pull_request"]

permissions: {}

jobs:
  lint:
    name: Super-Lint
    runs-on: ubuntu-latest
    permissions:
      # ref: https://github.com/super-linter/super-linter#get-started
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Superlinter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PowerShell
          VALIDATE_POWERSHELL: true
          FIX_POWERSHELL: false

  dispatch:
    runs-on: ubuntu-latest
    permissions:
      # createDispatchEvent is enforced against the classic `repo` scope,
      # which maps to contents: write for the GITHUB_TOKEN (actions: write
      # is NOT sufficient and returns 403 "Resource not accessible").
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [lint]
    steps:
      - name: Dispatch a release workflow run
        # release only after every platform in the test matrix succeeded
        # ref: https://github.com/actions/runner/issues/1251
        if: ${{ github.event_name == 'push' && always() && !contains(join(needs.*.result, ','), 'failure') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: "${{ env.GITHUB_TOKEN }}"
          script: |
            const payload = {
              run_id: "${{ github.run_id }}",
              sha: "${{ github.sha }}"
            }

            console.log("Sending event payload", JSON.stringify(payload, null, 2));

            const { owner, repo } = context.repo;
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'release',
              client_payload: payload
            });
